<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MGT 110 Study Guide</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <main id="app">

    <header class="app-header">

      <h1>MGT 110 Study Guide</h1>

      <p class="course-name">
        Administrative & Organizational Behavior
      </p>

      <p class="created-by">
        Created by Teng Xiong
      </p>

    </header>


    <!-- MAIN MENU -->

    <section id="menu" class="menu-grid">


      <!-- QUIZ 1 -->

      <div class="quiz-column">

        <h2>Quiz 1</h2>

        <h3>Chapters 1–4</h3>

        <button
          type="button"
          onclick="startChapter(1)">
          Chapter 1
        </button>

        <button
          type="button"
          onclick="startChapter(2)">
          Chapter 2
        </button>

        <button
          type="button"
          onclick="startChapter(3)">
          Chapter 3
        </button>

        <button
          type="button"
          onclick="startChapter(4)">
          Chapter 4
        </button>

        <button
          type="button"
          onclick="startQuizOne()">
          Quiz 1 — Mixed Practice
        </button>

      </div>


      <!-- QUIZ 2 -->

      <div class="quiz-column">

        <h2>Quiz 2</h2>

        <h3>
          Chapters 5, 7, 8 & 12
        </h3>
<button type="button" onclick="startChapter(5)">Chapter 5</button>
        <button type="button" onclick="startChapter(7)">Chapter 7</button>
        <button type="button" onclick="startChapter(8)">Chapter 8</button>
        <button type="button" onclick="startChapter(12)">Chapter 12</button>
        <button type="button" onclick="startQuizTwo()">Quiz 2 — Mixed Practice</button>
</div>


      <!-- QUIZ 3 -->

      <div class="quiz-column">

        <h2>Quiz 3</h2>

        <h3>
          Chapters 6, 9 & 11
        </h3>

        <button type="button" onclick="startChapter(6)">Chapter 6</button>
        <button type="button" onclick="startChapter(9)">Chapter 9</button>
        <button type="button" onclick="startChapter(11)">Chapter 11</button>
        <button type="button" onclick="startQuizThree()">Quiz 3 — Mixed Practice</button>

      </div>


      <!-- QUIZ 4 -->

      <div class="quiz-column">

        <h2>Quiz 4</h2>

        <h3>
          Chapters 14, 10, 15 & 13
        </h3>

        <button type="button" onclick="startChapter(14)">Chapter 14</button>
        <button type="button" onclick="startChapter(10)">Chapter 10</button>
        <button type="button" onclick="startChapter(15)">Chapter 15</button>
        <button type="button" onclick="startChapter(13)">Chapter 13</button>
        <button type="button" onclick="startQuizFour()">Quiz 4 — Mixed Practice</button>

      </div>

    </section>



    <!-- QUIZ SCREEN -->

    <section id="quiz" class="hidden">

      <div class="quiz-card">

        <button type="button" class="menu-button" onclick="backToMenu()">← Main Menu</button>

        <h2 id="chapterTitle"></h2>

        <p id="progress"></p>

        <h3 id="questionText"></h3>


        <!-- NEXT QUESTION -->

        <button
          type="button"
          id="nextButton"
          class="hidden"
          onclick="nextQuestion()">
          Next Question
        </button>


        <!-- FEEDBACK / EXPLANATION -->

        <div
          id="feedbackBox"
          class="feedback-box hidden">
        </div>


        <!-- ANSWER CHOICES -->

        <div id="answers"></div>

      </div>

    </section>



    <!-- RESULTS -->

    <section id="results" class="hidden">

      <div class="result-card">

        <h2>Quiz Complete</h2>

        <p id="scoreText"></p>

        <div id="chapterBreakdown"></div>


        <div class="result-buttons">

          <button
            type="button"
            onclick="retakeWrong()">
            Retake Wrong Answers
          </button>

          <button
            type="button"
            onclick="reviewAnswers()">
            Review All Answers
          </button>

          <button
            type="button"
            onclick="backToMenu()">
            Back to Main Menu
          </button>

        </div>


        <div id="reviewArea"></div>

      </div>

    </section>


  </main>


  <script src="./script.js"></script>
  <script src="./quiz2-ch5.js"></script>
  <script src="./quiz2-ch7.js"></script>
  <script src="./quiz2-ch8.js"></script>
  <script src="./quiz2-ch12.js"></script>
  <script src="./quiz3-ch6.js"></script>
  <script src="./quiz3-ch9.js"></script>
  <script src="./quiz3-ch11.js"></script>
  <script src="./quiz4-ch14.js"></script>
  <script src="./quiz4-ch10.js"></script>
  <script src="./quiz4-ch15.js"></script>
  <script src="./quiz4-ch13.js"></script>

</body>

</html>
